name: Cloudflare Production Build Probe

on:
  push:
    branches:
      - fix/cloudflare-production-truth

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - name: Build Cloudflare OpenNext artifact
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_URL: "https://lordenryque.com"
        run: pnpm build
      - name: Verify Cloudflare artifact
        run: |
          test -f .open-next/worker.js
          test -d .open-next/assets
