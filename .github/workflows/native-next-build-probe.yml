name: Native Next Build Probe

on:
  push:
    branches:
      - fix/vercel-next-build
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Native Next.js build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_URL: "https://lordenryque.com"
        run: pnpm exec next build
