name: Quick Inquiry Probe

on:
  push:
    branches:
      - growth/quick-inquiry-funnel

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint changed funnel files
        run: pnpm exec eslint src/components/sections/QuickInquiry.tsx src/components/sections/ContactView.tsx
