name: Feature Build Probe

on:
  push:
    branches:
      - growth/quick-inquiry-funnel
      - growth/commercial-offers

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - name: Native Next.js build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_URL: "https://lordenryque.com"
        run: pnpm exec next build
