name: Cloudflare Production Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build Cloudflare OpenNext artifact
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_URL: "https://lordenryque.com"
        run: pnpm build

      - name: Verify Cloudflare artifact
        run: |
          test -f .open-next/worker.js
          test -d .open-next/assets

      - name: Validate Wrangler deployment bundle
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler-dry-run
